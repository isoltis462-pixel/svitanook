<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СВІТАНОК — Головна</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <a href="index.html" class="logo">СВІТАНОК</a>
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Пошук товарів...">
      </div>
      <nav class="nav-menu">
        <a href="index.html" class="nav-link active">Головна</a>
        <a href="cart.html" class="nav-link">Кошик</a>
        <a href="profile.html" class="nav-link">Профіль</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="action-btn" title="Кошик">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="action-badge" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-content">
      <h1>СВІТАНОК — початок чогось нового</h1>
      <p>Сучасний український e-commerce бренд із преміальними товарами для затишку.</p>
    </div>
  </section>

  <main class="container" style="padding: 40px 20px;">
    <h2 style="margin-bottom: 24px; color: var(--secondary);">Каталог товарів</h2>
    <div class="product-grid" id="productGrid"></div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 СВІТАНОК. Усі права захищені.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
